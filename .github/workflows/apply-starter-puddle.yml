name: Apply starter puddle

on:
  push:
    paths:
      - '.github/workflows/apply-starter-puddle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace START with starter ink puddle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text()
          if 'starterPuddle: { radius: 20 }' in s:
              print('starter puddle already applied')
              raise SystemExit(0)

          s = s.replace(
              "    homeRadius: 10,\n    homeY: 0.80,\n",
              "    starterPuddle: { radius: 20 },\n"
          )
          s = s.replace(
              "  let ink = new Set();\n  let connected = new Set();\n",
              "  let ink = new Set();\n  let starterInk = new Set();\n  let connected = new Set();\n"
          )

          old = '''  function home() {
            return {
              x: Math.floor(CONFIG.cols / 2),
              y: Math.floor(CONFIG.rows * CONFIG.homeY),
            };
          }
          '''
          new = '''  function starterAnchor() {
            const radius = CONFIG.starterPuddle.radius;
            return {
              x: Math.floor(CONFIG.cols / 2),
              y: CONFIG.rows - 1 - Math.round(radius * .42),
            };
          }
          '''
          assert old in s
          s = s.replace(old, new)

          needle = '''  function splashPoint(cx, cy, minDistance, maxDistance) {
          '''
          insert = '''  function createStarterPuddle() {
            const target = new Set();
            const anchor = starterAnchor();
            const radius = CONFIG.starterPuddle.radius;
            const bottom = CONFIG.rows - 1;

            // A low, irregular pool that visibly continues through the bottom edge.
            addDisk(anchor.x, bottom - 2, radius * .82, target);
            addDisk(anchor.x - radius * .58, bottom - 4, radius * .48, target);
            addDisk(anchor.x + radius * .58, bottom - 3, radius * .54, target);
            addDisk(anchor.x - radius * .10, bottom - radius * .55, radius * .55, target);
            addDisk(anchor.x + radius * .34, bottom - radius * .62, radius * .42, target);

            // Small connected bumps keep the silhouette from reading as a clean semicircle.
            const bumps = randInt(2, 3);
            for (let i = 0; i < bumps; i++) {
              const angle = rand(Math.PI * 1.08, Math.PI * 1.92);
              const distance = rand(radius * .32, radius * .58);
              addDisk(
                anchor.x + Math.cos(angle) * distance,
                bottom - radius * .42 + Math.sin(angle) * distance * .42,
                radius * rand(.20, .30),
                target
              );
            }

            starterInk = target;
            for (const k of starterInk) ink.add(k);
          }

          '''
          assert needle in s
          s = s.replace(needle, insert + needle)

          s = s.replace("    const h = home();\n", "    const anchor = starterAnchor();\n", 1)
          s = s.replace(
              "      const tooCloseHome = Math.hypot(x - h.x, y - h.y) < CONFIG.resources.minHomeDistance + radius;\n",
              "      const tooCloseStarter = Math.hypot(x - anchor.x, y - anchor.y) < CONFIG.resources.minHomeDistance + radius;\n"
          )
          s = s.replace(
              "      if (!tooCloseHome && !overlaps) break;\n",
              "      if (!tooCloseStarter && !overlaps) break;\n"
          )

          old_refresh = '''  function refreshConnected() {
            const h = home();
            const queue = [];
            const active = new Set();

            for (const k of ink) {
              const p = parseKey(k);
              if (Math.hypot(p.x - h.x, p.y - h.y) <= CONFIG.homeRadius + 3) {
                active.add(k);
                queue.push(k);
              }
            }

            for (let i = 0; i < queue.length; i++) {
          '''
          new_refresh = '''  function refreshConnected() {
            const queue = [];
            const active = new Set();

            // Connectivity originates from the starter puddle itself, not an invisible point.
            for (const k of starterInk) {
              if (!ink.has(k)) continue;
              active.add(k);
              queue.push(k);
            }

            for (let i = 0; i < queue.length; i++) {
          '''
          assert old_refresh in s
          s = s.replace(old_refresh, new_refresh)

          old_render = '''    const h = home();
            ctx.save();
            ctx.translate((h.x+.5)*m.sx, (h.y+.5)*m.sy);
            ctx.fillStyle = '#fffaf0';
            ctx.strokeStyle = '#263d37';
            ctx.lineWidth = 2 / camera.zoom;
            ctx.beginPath();
            ctx.arc(0,0, Math.max(14 / camera.zoom, CONFIG.homeRadius*m.sx), 0, TAU);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#263d37';
            ctx.font = `700 ${11 / camera.zoom}px system-ui`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('START',0,0);
            ctx.restore();

          '''
          assert old_render in s
          s = s.replace(old_render, '')

          s = s.replace(
              '70%以上を塗ってSTARTへ接続すると取得。',
              '70%以上を塗って起点のインク溜まりへ接続すると取得。'
          )
          s = s.replace(
              "    ink = new Set();\n    connected = new Set();\n",
              "    ink = new Set();\n    starterInk = new Set();\n    connected = new Set();\n"
          )

          old_reset = '''    const h = home();
            addDisk(h.x, h.y, CONFIG.homeRadius);
            refreshConnected();
          '''
          new_reset = '''    createStarterPuddle();
            refreshConnected();
          '''
          assert old_reset in s
          s = s.replace(old_reset, new_reset)

          p.write_text(s)
          PY

          node --check app.js
          git diff --check

      - name: Commit starter puddle
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Replace START with starter ink puddle"
          git push origin HEAD:main
