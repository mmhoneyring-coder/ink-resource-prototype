name: Patch known score emphasis
'on':
  push:
    paths:
      - '.github/workflows/patch-known-score-emphasis.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply known score emphasis patch
        run: python .github/scripts/patch_known_score_emphasis.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          css=Path('app.css').read_text(encoding='utf-8')
          assert '.score-token.known {' in css
          assert 'font-size: 10.5px' in css
          assert 'color: var(--accent)' in css
          assert '.score-token.owned { color: var(--score-gold); }' in css
          PY
          git diff -- app.css
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.css
          git commit -m "Emphasize revealed scores"
          git push
