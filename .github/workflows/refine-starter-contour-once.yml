name: Refine starter contour once

on:
  push:
    paths:
      - '.github/workflows/refine-starter-contour-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine starter contour
        env:
          MIGRATION_B64: ""
        run: |
          echo "$MIGRATION_B64" | base64 -d > /tmp/migrate.py
          python /tmp/migrate.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          git diff --check
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Refine enlarged starter contour'
          git push
