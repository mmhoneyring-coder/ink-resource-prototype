name: Patch turn guides
'on':
  push:
    paths:
      - '.github/workflows/patch-turn-guides.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply turn guide patch
        run: python .github/scripts/patch_turn_guides.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          assert 'id="turnOverlay"' in index
          assert '.turn-overlay' in css
          assert "showTurnOverlay(`残り ${remaining}巡`" in js
          assert "showTurnOverlay('スプラッシュ'" in js
          assert "showTurnOverlay('マーカー'" in js
          assert 'showMarkerIntro();' in js
          assert 'showRoundIntro();' in js
          PY
          git diff -- index.html app.css app.js
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app.css app.js
          git commit -m "Add turn phase overlays"
          git push
