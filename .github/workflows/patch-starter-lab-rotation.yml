name: Patch START lab rotation
on:
  push:
    paths:
      - '.github/workflows/patch-starter-lab-rotation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch START lab
        run: python tools/patch_starter_lab_rotation.py
      - name: Commit patched lab
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add starter-lab.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix START size preview and add rotation control"
          git push
