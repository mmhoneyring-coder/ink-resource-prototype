name: Replace starter with 2D mass once

on:
  push:
    paths:
      - '.github/workflows/replace-starter-with-2d-mass-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace START generator
        run: python .github/scripts/replace_starter_with_2d_mass.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          git diff --check
      - name: Commit 2D START generator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Generate starter as cropped 2D ink mass'
          git push
