name: Revert splash core count
on:
  push:
    paths:
      - '.github/workflows/revert-core-count.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revert core count only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          src = path.read_text(encoding='utf-8')
          old = '      coreCount: [6, 9],'
          new = '      coreCount: [3, 5],'
          if src.count(old) != 1:
              raise SystemExit(f'Expected one coreCount line, found {src.count(old)}')
          path.write_text(src.replace(old, new, 1), encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git diff -- app.js
      - name: Commit change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Restore splash core count to 3-5"
          git push
