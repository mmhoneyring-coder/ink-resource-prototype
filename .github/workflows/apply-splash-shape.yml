name: Apply splash shape migration

on:
  push:
    paths:
      - '.github/workflows/apply-splash-shape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply splash migration
        run: python .github/scripts/apply_splash_shape_patch.py
      - name: Commit app.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No app.js changes"
            exit 0
          fi
          git commit -m "Rebuild splash as shape-first ink islands"
          git push
