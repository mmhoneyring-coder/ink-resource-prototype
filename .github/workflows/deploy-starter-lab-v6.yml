name: Deploy START lab v6
on:
  push:
    paths:
      - '.github/workflows/deploy-starter-lab-v6.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write START lab v6
        run: python tools/deploy_starter_lab_v6.py
      - name: Commit START lab v6
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add starter-lab.html
          git diff --cached --quiet && exit 0
          git commit -m "Refocus START lab on selected top-30-percent contours"
          git push
