name: Validate starter lab once

on:
  push:
    paths:
      - '.github/workflows/validate-starter-lab-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lab JavaScript
        run: node --check starter-lab.js
      - name: Check lab files
        run: |
          test -f starter-lab.html
          test -f starter-lab.css
          grep -q 'starter-lab.css' starter-lab.html
          grep -q 'starter-lab.js' starter-lab.html
