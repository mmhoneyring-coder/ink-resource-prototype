name: Enlarge starter once

on:
  push:
    paths:
      - '.github/workflows/enlarge-starter-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply starter scale change
        run: python .github/scripts/enlarge_starter_once.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Commit app.js
        run: |
          if git diff --quiet -- app.js; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Increase starter puddle size slightly'
          git push
