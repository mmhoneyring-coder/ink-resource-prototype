name: Enlarge starter once

on:
  push:
    paths:
      - '.github/workflows/enlarge-starter-once.yml'

permissions:
  contents: write

jobs:
  enlarge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge starter only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = 'starterPuddle: { radius: 30 }'
          new = 'starterPuddle: { radius: 48 }'
          if old not in s:
              raise SystemExit('starter radius target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check app.js
          git diff --check
      - name: Commit starter enlargement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Enlarge starter for safer touch area'
          git push
