name: Restore classic splash shape
on:
  push:
    paths:
      - '.github/workflows/restore-classic-splash.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore classic blob shape only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          src = path.read_text(encoding='utf-8')

          core_pat = re.compile(r"\n\s*const flow = Math\.atan2\(p\.y - impact\.y, p\.x - impact\.x\) \|\| directions\[0\] \|\| rand\(0, TAU\);\n\s*addDirectionalInkBlob\(p\.x, p\.y, rand\(\.\.\.CONFIG\.splash\.coreRadius\), flow, 'core', splashInk\);")
          drop_pat = re.compile(r"\n\s*const flow = Math\.atan2\(p\.y - impact\.y, p\.x - impact\.x\) \|\| directions\[0\] \|\| rand\(0, TAU\);\n\s*addDirectionalInkBlob\(p\.x, p\.y, rand\(\.\.\.CONFIG\.splash\.dropletRadius\), flow, 'droplet', splashInk\);")

          src, core_n = core_pat.subn("\n      addBlob(p.x, p.y, rand(...CONFIG.splash.coreRadius), [2, 5], splashInk);", src, count=1)
          src, drop_n = drop_pat.subn("\n      addBlob(p.x, p.y, rand(...CONFIG.splash.dropletRadius), [1, 3], splashInk);", src, count=1)
          if core_n != 1 or drop_n != 1:
              raise SystemExit(f'Unexpected replacement counts: core={core_n}, droplet={drop_n}')

          path.write_text(src, encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git diff -- app.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Restore classic splash blob shapes"
          git push
