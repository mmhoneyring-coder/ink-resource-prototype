name: Apply starter puddle shape

on:
  push:
    paths:
      - '.github/workflows/apply-starter-puddle-shape.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make starter puddle read as cropped ink island
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text()

          s = s.replace(
              "    starterPuddle: { radius: 20 },",
              "    starterPuddle: { radius: 30 },"
          )

          anchor = '''  function starterAnchor() {
            const radius = CONFIG.starterPuddle.radius;
            return {
              x: Math.floor(CONFIG.cols / 2),
              y: CONFIG.rows - 1 - Math.round(radius * .20),
            };
          }

          function inBounds'''
          s, n = re.subn(
              r"  function starterAnchor\(\) \{.*?\n  \}\n\n  function inBounds",
              anchor,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1

          puddle = '''  function createStarterPuddle() {
            const target = new Set();
            const anchor = starterAnchor();
            const radius = CONFIG.starterPuddle.radius;
            const edge = CONFIG.rows - 1;
            const cx = anchor.x;

            // Treat this as a much larger ink island continuing below the board.
            // Only its upper rim is visible, so it reads like a cropped coast rather than a mound.
            addDisk(cx, edge + radius * .50, radius * .92, target);
            addDisk(cx - radius * .34, edge + radius * .38, radius * .56, target);
            addDisk(cx + radius * .32, edge + radius * .34, radius * .58, target);

            // Uneven overlapping lobes form the visible shoreline.
            const rim = [
              [-.43, .06, .30],
              [-.25, -.05, .34],
              [-.08, -.10, .31],
              [ .10, -.07, .35],
              [ .28,  .00, .30],
              [ .43,  .08, .25],
            ];
            for (const [dx, dy, rr] of rim) {
              addDisk(
                cx + dx * radius + rand(-1.3, 1.3),
                edge + dy * radius + rand(-1.0, 1.0),
                rr * radius * rand(.92, 1.08),
                target
              );
            }

            // A few tiny connected bulges break up the digital-looking smooth dome.
            const nubs = randInt(3, 5);
            for (let i = 0; i < nubs; i++) {
              const x = cx + rand(-radius * .42, radius * .42);
              const y = edge - rand(1.5, 5.5);
              addDisk(x, y, rand(2.8, 4.6), target);
            }

            starterInk = target;
            for (const k of starterInk) ink.add(k);
          }

          function splashPoint'''
          s, n = re.subn(
              r"  function createStarterPuddle\(\) \{.*?\n  \}\n\n  function splashPoint",
              puddle,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1

          p.write_text(s)
          PY

          node --check app.js
          git diff --check

      - name: Commit starter puddle shape
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Shape starter as cropped ink island"
          git push origin HEAD:main
