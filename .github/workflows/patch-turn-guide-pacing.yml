name: Patch turn guide pacing
'on':
  push:
    paths:
      - '.github/workflows/patch-turn-guide-pacing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pacing patch
        run: python .github/scripts/patch_turn_guide_pacing.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          css=Path('app.css').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          assert 'transition: opacity .42s ease' in css
          assert 'border: 1px solid rgba(47,43,35,.14)' not in css[css.index('.turn-overlay strong'):css.index('.start-card')]
          assert 'background: rgba(255,252,243,.94)' not in css[css.index('.turn-overlay strong'):css.index('.start-card')]
          assert 'text-shadow:' in css[css.index('.turn-overlay strong'):css.index('.start-card')]
          assert "showTurnOverlay(`残り ${remaining}巡`, 1250" in js
          assert "showTurnOverlay('スプラッシュ', 1000)" in js
          assert "showTurnOverlay('マーカー', 1000)" in js
          assert '}, 420);' in js
          PY
          git diff -- app.css app.js
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.css app.js
          git commit -m "Refine turn guide pacing"
          git push
