name: Patch three-tier splash
'on':
  push:
    paths:
      - '.github/workflows/patch-three-tier-splash.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply splash patch
        run: python .github/scripts/patch_three_tier_splash.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text(encoding='utf-8')
          assert 'coreCount: [2, 4]' in text
          assert 'mediumCount: [2, 4]' in text
          assert 'coreRadius: [10 * GRID_SCALE, 15 * GRID_SCALE]' in text
          assert 'mediumRadius: [6 * GRID_SCALE, 10 * GRID_SCALE]' in text
          assert 'targetArea: [2200 * GRID_SCALE * GRID_SCALE, 2400 * GRID_SCALE * GRID_SCALE]' in text
          assert 'CONFIG.splash.radialBias.medium' in text
          PY
          git diff -- app.js
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Add three-tier splash sizes"
          git push
