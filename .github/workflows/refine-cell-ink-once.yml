name: Refine cell ink once

on:
  push:
    paths:
      - '.github/workflows/refine-cell-ink-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine cell-native starter and splash shapes
        run: python .github/scripts/refine_cell_ink_once.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          git diff --check
      - name: Commit refinement
        run: |
          if git diff --quiet -- app.js; then
            echo 'No app.js changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Refine cell-native starter and splash shapes'
          git push
