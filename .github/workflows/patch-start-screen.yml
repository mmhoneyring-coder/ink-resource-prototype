name: Patch start screen
'on':
  push:
    paths:
      - '.github/workflows/patch-start-screen.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply start screen patch
        run: python .github/scripts/patch_start_screen.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          assert 'id="startScreen"' in index
          assert 'id="startBtn"' in index
          assert 'id="highScoreList"' in index
          assert '遊び方' in index and 'ハイスコア' in index
          assert '.start-screen' in css and '.high-score-row' in css
          assert "inkResource.bestRuns.v1" in js
          assert 'recordHighScore();' in js
          assert 'renderHighScores();' in js
          PY
          git diff -- index.html app.css app.js
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app.css app.js
          git commit -m "Add start screen and high scores"
          git push
