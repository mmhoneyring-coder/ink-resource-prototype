name: Restore splash radial bias
on:
  push:
    paths:
      - '.github/workflows/restore-radial-bias.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch splash radial bias
        run: python .github/scripts/patch_restore_radial_bias.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          git diff -- app.js
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Restore splash radial bias"
          git push
