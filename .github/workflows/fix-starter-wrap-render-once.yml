name: Fix START wrap render once

on:
  push:
    paths:
      - '.github/workflows/fix-starter-wrap-render-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch START wrap lab
        run: python .github/scripts/fix-starter-wrap-render.py
      - name: Validate JavaScript
        run: node --check starter-wrap-lab.js
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starter-wrap-lab.js
          git diff --cached --quiet && exit 1
          git commit -m "Fix START wrap lab rendering"
          git push
