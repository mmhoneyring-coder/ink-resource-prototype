name: Tune splash size and count
'on':
  push:
    paths:
      - '.github/workflows/tune-splash-size-count.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune splash size and count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          src = path.read_text(encoding='utf-8')
          replacements = {
              '      coreCount: [3, 5],': '      coreCount: [6, 9],',
              '      dropletCount: [1, 5],': '      dropletCount: [5, 9],',
              '      coreRadius: [14 * GRID_SCALE, 20 * GRID_SCALE],': '      coreRadius: [9 * GRID_SCALE, 14 * GRID_SCALE],',
              '      dropletRadius: [5 * GRID_SCALE, 10 * GRID_SCALE],': '      dropletRadius: [3 * GRID_SCALE, 6 * GRID_SCALE],',
              '      minIslandArea: 30 * GRID_SCALE * GRID_SCALE,': '      minIslandArea: 12 * GRID_SCALE * GRID_SCALE,',
          }
          for old, new in replacements.items():
              if src.count(old) != 1:
                  raise SystemExit(f'Expected one match for {old!r}, found {src.count(old)}')
              src = src.replace(old, new, 1)
          path.write_text(src, encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git diff -- app.js
      - name: Commit tuning
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Tune splash island size and count"
          git push
