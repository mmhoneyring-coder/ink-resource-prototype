name: Try simple shape-first splash
on:
  push:
    paths:
      - '.github/workflows/try-simple-shape-first-splash.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch splash
        run: python .github/scripts/patch_shape_first_splash.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          git diff -- app.js
      - name: Commit trial
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Try simple shape-first splash"
          git push
