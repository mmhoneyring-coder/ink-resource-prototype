name: Double internal resolution once

on:
  push:
    paths:
      - '.github/workflows/double-resolution-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 2x internal resolution
        run: python .github/scripts/double_resolution_once.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          git diff --check
      - name: Commit resolution update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Double ink grid resolution and enlarge starter'
          git push
