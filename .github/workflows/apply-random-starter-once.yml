name: Apply random starter once

on:
  push:
    paths:
      - '.github/workflows/apply-random-starter-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trial then apply random starter
        run: python .github/scripts/apply_random_starter.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          git diff --check
      - name: Commit starter implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Randomize cell-native starter splat'
          git push
