name: Evolve starter profile once

on:
  push:
    paths:
      - '.github/workflows/evolve-starter-profile-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply evolved starter profile
        run: python .github/scripts/evolve_starter_profile.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          git diff --check
      - name: Commit evolved starter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Use evolved cell-native starter profiles'
          git push
