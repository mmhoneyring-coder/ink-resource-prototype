name: Balance splash total area
on:
  push:
    paths:
      - '.github/workflows/balance-splash-area.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch splash area balancing
        run: python .github/scripts/patch_balance_splash_area.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          git diff -- app.js
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Balance splash total area"
          git push
