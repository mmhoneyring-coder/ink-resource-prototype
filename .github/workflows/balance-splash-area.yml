name: Balance splash total area
on:
  push:
    paths:
      - '.github/workflows/balance-splash-area.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Balance per-splash total area
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          src = path.read_text(encoding='utf-8')

          old_cfg = '''      coreCount: [3, 5],
      dropletCount: [5, 9],
      speckCount: [0, 0],
      coreRadius: [9 * GRID_SCALE, 14 * GRID_SCALE],
      dropletRadius: [3 * GRID_SCALE, 6 * GRID_SCALE],
      speckRadius: [3 * GRID_SCALE, 5 * GRID_SCALE],
      spread: 60 * GRID_SCALE,
      farSpread: 84 * GRID_SCALE,
      aimDrift: [0, 0],
      minIslandArea: 12 * GRID_SCALE * GRID_SCALE,'''
          new_cfg = '''      coreCount: [3, 5],
      dropletCount: [3, 12],
      speckCount: [0, 0],
      coreRadius: [9 * GRID_SCALE, 14 * GRID_SCALE],
      dropletRadius: [3 * GRID_SCALE, 6 * GRID_SCALE],
      speckRadius: [3 * GRID_SCALE, 5 * GRID_SCALE],
      spread: 60 * GRID_SCALE,
      farSpread: 84 * GRID_SCALE,
      aimDrift: [0, 0],
      minIslandArea: 12 * GRID_SCALE * GRID_SCALE,
      targetArea: [2000 * GRID_SCALE * GRID_SCALE, 2200 * GRID_SCALE * GRID_SCALE],'''
          if src.count(old_cfg) != 1:
              raise SystemExit(f'Expected one splash config block, found {src.count(old_cfg)}')
          src = src.replace(old_cfg, new_cfg, 1)

          splash_pat = re.compile(r"  function splashAt\(cx, cy\) \{.*?\n  \}\n\n  function placeResource", re.S)
          match = splash_pat.search(src)
          if not match:
              raise SystemExit('Could not locate splashAt block')

          new_splash = '''  function splashAt(cx, cy) {
    if (gameOver || phase !== 'splash') return;

    const splashInk = new Set();
    const core = randInt(...CONFIG.splash.coreCount);
    const targetArea = rand(...CONFIG.splash.targetArea);
    const impact = { x: cx, y: cy };

    // Keep each splash's total ink area roughly stable. More medium islands
    // consume a larger share of the area budget, leaving less for small ones.
    const coreShare = .64 + (core - CONFIG.splash.coreCount[0]) * .08;
    const idealCoreRadius = Math.sqrt((targetArea * coreShare / core) / Math.PI);

    for (let i = 0; i < core; i++) {
      const p = splashPoint(
        impact.x,
        impact.y,
        i === 0 ? 0 : 10 * GRID_SCALE,
        i === 0 ? 12 * GRID_SCALE : CONFIG.splash.spread
      );
      const flow = Math.atan2(p.y - impact.y, p.x - impact.x) || rand(0, TAU);
      const radius = clamp(
        idealCoreRadius * rand(.90, 1.10),
        ...CONFIG.splash.coreRadius
      );
      addShapeFirstSplashIsland(
        p.x,
        p.y,
        radius,
        flow,
        'core',
        splashInk
      );
    }

    const [minDroplets, maxDroplets] = CONFIG.splash.dropletCount;
    let droplets = 0;
    while (droplets < maxDroplets && (droplets < minDroplets || splashInk.size < targetArea)) {
      const p = splashPoint(
        impact.x,
        impact.y,
        26 * GRID_SCALE,
        CONFIG.splash.farSpread
      );
      const flow = Math.atan2(p.y - impact.y, p.x - impact.x) || rand(0, TAU);
      addShapeFirstSplashIsland(
        p.x,
        p.y,
        rand(...CONFIG.splash.dropletRadius),
        flow,
        'droplet',
        splashInk
      );
      droplets += 1;
    }

    pruneSmallIslands(splashInk, CONFIG.splash.minIslandArea);
    for (const k of splashInk) ink.add(k);

    refreshConnected();
    updateResources();
    phase = 'brush';
    brushRemaining = CONFIG.brushAreaPerTurn;
    updateHud();
    updateActionAvailability();
    render();
  }

  function placeResource'''
          src = src[:match.start()] + new_splash + src[match.end():]
          path.write_text(src, encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git diff -- app.js
      - name: Commit change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Balance splash total area"
          git push
