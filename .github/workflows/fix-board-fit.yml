name: One-time board fit repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-board-fit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app
        run: python .github/fix-board-fit.py
      - name: Validate
        run: |
          node --check app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Restore full-board fit and pinch recovery"
          git push
