name: Tune splash blob shapes
on:
  push:
    paths:
      - '.github/workflows/tune-splash-blob-shapes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make splash islands visibly non-circular
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          src = path.read_text(encoding='utf-8')

          old_blob = '''  function addBlob(cx, cy, baseRadius, lobes = [2, 5], target = ink) {
    addDisk(cx, cy, baseRadius * rand(.72, .98), target);
    const count = randInt(...lobes);
    for (let i = 0; i < count; i++) {
      const angle = rand(0, TAU);
      const dist = rand(baseRadius * .25, baseRadius * .85);
      addDisk(
        cx + Math.cos(angle) * dist,
        cy + Math.sin(angle) * dist,
        baseRadius * rand(.32, .68),
        target
      );
    }
  }
'''

          new_blob = '''  function addBlob(cx, cy, baseRadius, lobes = [2, 5], target = ink) {
    // Keep the classic overlapping-cell construction, but let the lobes define
    // the silhouette instead of letting one large central disk dominate it.
    addDisk(cx, cy, baseRadius * rand(.58, .76), target);
    const count = randInt(...lobes);
    const hero = randInt(0, Math.max(0, count - 1));
    for (let i = 0; i < count; i++) {
      const angle = rand(0, TAU);
      const outer = i === hero;
      const dist = outer
        ? rand(baseRadius * .70, baseRadius * .96)
        : rand(baseRadius * .46, baseRadius * .90);
      const lobeRadius = baseRadius * rand(
        outer ? .42 : .34,
        outer ? .62 : .58
      );
      addDisk(
        cx + Math.cos(angle) * dist,
        cy + Math.sin(angle) * dist,
        lobeRadius,
        target
      );
    }
  }
'''

          if src.count(old_blob) != 1:
              raise SystemExit(f'Expected one classic addBlob, found {src.count(old_blob)}')
          src = src.replace(old_blob, new_blob, 1)

          old_speck = '''      addDisk(p.x, p.y, rand(...CONFIG.splash.speckRadius), splashInk);'''
          new_speck = '''      addBlob(p.x, p.y, rand(...CONFIG.splash.speckRadius), [1, 2], splashInk);'''
          if src.count(old_speck) != 1:
              raise SystemExit(f'Expected one speck addDisk call, found {src.count(old_speck)}')
          src = src.replace(old_speck, new_speck, 1)

          path.write_text(src, encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git diff -- app.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Reduce circular splash islands"
          git push
