name: Make brush toolbar draggable

on:
  push:
    paths:
      - '.github/workflows/make-brush-toolbar-draggable.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply draggable brush toolbar migration
        run: python .github/scripts/make_brush_toolbar_draggable.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Commit app.js and app.css
        run: |
          if git diff --quiet -- app.js app.css; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js app.css
          git commit -m 'Make brush toolbar draggable'
          git push
