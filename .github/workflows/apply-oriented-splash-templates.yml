name: Apply oriented splash templates

on:
  push:
    paths:
      - '.github/workflows/apply-oriented-splash-templates.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply oriented splash templates
        run: python .github/scripts/apply_oriented_splash_templates.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Commit app.js
        run: |
          if git diff --quiet -- app.js; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Use direction-aware ink silhouettes for splash'
          git push
