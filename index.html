<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f3eddc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ink Resource" />
  <link rel="manifest" href="app.webmanifest" />
  <title>Ink Resource Prototype</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <main class="app-shell">
    <div class="start-screen" id="startScreen">
      <div class="start-card">
        <div class="start-title">
          <span>INK RESOURCE</span>
          <strong>インクをつないで、資源を取る</strong>
        </div>

        <button id="startBtn" class="start-button" type="button">はじめる</button>

        <section class="start-section how-to-play" aria-labelledby="howToPlayTitle">
          <h2 id="howToPlayTitle">遊び方</h2>
          <ol>
            <li><strong>スプラッシュ</strong><span>盤面を1回タップしてインクを飛ばす</span></li>
            <li><strong>マーカーでつなぐ</strong><span>細ペン・太ペンを使い、限られたインクで島をつなぐ</span></li>
            <li><strong>資源を取る</strong><span>30%塗ると点数判明。70%以上塗って下の起点までつなぐと取得</span></li>
            <li><strong>4ラウンド</strong><span>スプラッシュ→マーカーを4回繰り返し、合計得点を競う</span></li>
          </ol>
        </section>

        <section class="start-section high-scores" aria-labelledby="highScoreTitle">
          <div class="start-section-heading">
            <h2 id="highScoreTitle">ハイスコア</h2>
            <small>BEST 3</small>
          </div>
          <ol id="highScoreList" class="high-score-list"></ol>
        </section>
      </div>
    </div>

    <div class="turn-overlay" id="turnOverlay" hidden aria-live="polite">
      <strong id="turnOverlayText"></strong>
    </div>

    <header class="hud" aria-label="ゲーム状況">
      <div class="score-stat">
        <span>得点</span>
        <strong id="score">0</strong>
      </div>

      <button id="splashBtn" class="phase-card active" type="button" aria-label="現在の行動">
        <span class="phase-card-inner" aria-hidden="true">
          <span class="phase-face phase-front">
            <span class="phase-icon">✦</span>
            <span>スプラッシュ</span>
          </span>
          <span class="phase-face phase-back">
            <span class="phase-icon brush-mark">✎</span>
            <span>マーカー</span>
          </span>
        </span>
        <small id="splashLeft" class="phase-round">1/4</small>
      </button>

      <button id="newBtn" class="new-button" type="button" aria-label="新しい盤面">新規</button>

      <strong id="roundCount" hidden>1/4</strong>
      <strong id="ownedCount" hidden>0</strong>
    </header>

    <section class="play-area" aria-label="ゲーム盤面と公開得点">
      <section class="board-wrap" id="boardWrap" aria-label="ゲーム盤面">
        <canvas id="board" width="420" height="870"></canvas>
        <div class="hint" id="hint">ラウンド1：スプラッシュを1回</div>
      </section>

      <section class="score-board" id="scoreBoard" aria-label="公開得点ボード"></section>
    </section>

    <nav class="actions" aria-label="マーカー操作">
      <button id="brushBtn" class="action" type="button" aria-label="細ペン">
        <span class="pen-dot thin-dot"></span>
        <span>細ペン</span>
      </button>
      <button id="moveBtn" class="action" type="button" aria-label="太ペン">
        <span class="pen-dot wide-dot"></span>
        <span>太ペン</span>
      </button>
      <div class="ink-gauge inactive" id="penLoad" role="progressbar" aria-label="マーカーインク残量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-valuetext="残り100%">
        <span class="ink-label">INK</span>
        <div class="meter" aria-hidden="true"><i id="inkFill"></i></div>
        <small id="brushRemaining">100%</small>
      </div>
    </nav>

    <div class="internal-controls" hidden aria-hidden="true">
      <button id="zoomOut" type="button">−</button>
      <button id="zoomReset" type="button">100%</button>
      <button id="zoomIn" type="button">＋</button>
      <button id="distributionBtn" type="button">分布</button>
      <div class="distribution-panel" id="distributionPanel" hidden>
        <button id="distributionClose" type="button">×</button>
        <div id="distributionContent"></div>
      </div>
    </div>

    <div class="result" id="result" hidden>
      <div class="result-card">
        <p>今回の得点</p>
        <strong id="finalScore">0</strong>
        <p class="result-sub">取得 <strong id="finalOwned">0</strong>個</p>
        <div class="result-actions">
          <button id="retryBtn" type="button">同じ盤面でもう一度</button>
          <button id="nextBtn" type="button">新しい盤面</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
