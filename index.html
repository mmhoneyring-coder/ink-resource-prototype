<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f3eddc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ink Resource" />
  <link rel="manifest" href="app.webmanifest" />
  <title>Ink Resource Prototype</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hud">
      <div class="stat"><span>得点</span><strong id="score">0</strong></div>
      <div class="stat"><span>ラウンド</span><strong id="roundCount">1/4</strong></div>
      <div class="stat compact"><span>取得</span><strong id="ownedCount">0</strong></div>
    </header>

    <section class="score-board" id="scoreBoard" aria-label="公開得点ボード"></section>

    <section class="board-wrap" id="boardWrap" aria-label="ゲーム盤面">
      <canvas id="board" width="420" height="1120"></canvas>

      <div class="zoom-tools" aria-label="表示範囲">
        <button id="zoomOut" type="button" aria-label="広く見る">−</button>
        <button id="zoomReset" type="button" aria-label="標準表示に戻す">100%</button>
        <button id="zoomIn" type="button" aria-label="近く見る">＋</button>
        <button id="distributionBtn" type="button" aria-label="埋蔵分布を見る">分布</button>
        <button id="newBtn" type="button" aria-label="新しい盤面">新規</button>
      </div>

      <div class="distribution-panel" id="distributionPanel" hidden>
        <div class="distribution-head">
          <strong>埋蔵ルール</strong>
          <button id="distributionClose" type="button" aria-label="閉じる">×</button>
        </div>
        <div id="distributionContent"></div>
      </div>

      <div class="hint" id="hint">ラウンド1：スプラッシュを1回</div>
    </section>

    <nav class="actions" aria-label="現在の行動と筆操作">
      <button id="splashBtn" class="phase-card active" type="button" aria-label="現在の行動">
        <span class="phase-card-inner" aria-hidden="true">
          <span class="phase-face phase-front">
            <span class="phase-icon">✦</span>
            <span>スプラッシュ</span>
          </span>
          <span class="phase-face phase-back">
            <span class="phase-icon brush-mark">✎</span>
            <span>筆</span>
          </span>
        </span>
        <small id="splashLeft" class="phase-round">1/4</small>
      </button>
      <button id="brushBtn" class="action" type="button" aria-label="細筆">
        <span class="pen-dot thin-dot"></span>
        <span>細筆</span>
      </button>
      <button id="moveBtn" class="action" type="button" aria-label="太筆">
        <span class="pen-dot wide-dot"></span>
        <span>太筆</span>
      </button>
      <div class="ink-gauge inactive" id="penLoad" role="progressbar" aria-label="筆インク残量" aria-valuemin="0" aria-valuemax="650" aria-valuenow="650">
        <svg class="penicon" viewBox="0 0 32 42" aria-hidden="true">
          <path d="M13 3h8l5 27-9 9-9-9Z" fill="#f8f6ee" stroke="#555" stroke-width="2"/>
          <path d="M13 3h8l1 7h-10Z" fill="#6c7783"/>
          <path d="M12 28h10l-5 11Z" fill="#d8c7a0"/>
          <circle cx="17" cy="28" r="2" fill="#222"/>
        </svg>
        <div class="meter" aria-hidden="true"><i id="inkFill"></i></div>
        <small id="brushRemaining">650</small>
      </div>
    </nav>

    <div class="result" id="result" hidden>
      <div class="result-card">
        <p>今回の得点</p>
        <strong id="finalScore">0</strong>
        <p class="result-sub">取得 <strong id="finalOwned">0</strong>個</p>
        <div class="result-actions">
          <button id="retryBtn" type="button">同じ盤面でもう一度</button>
          <button id="nextBtn" type="button">新しい盤面</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
