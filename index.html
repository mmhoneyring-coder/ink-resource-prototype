<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f3eddc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ink Resource" />
  <link rel="manifest" href="app.webmanifest" />
  <title>Ink Resource Prototype</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hud">
      <div class="stat"><span>得点</span><strong id="score">0</strong></div>
      <div class="stat"><span>インク</span><strong id="inkRemaining">100</strong></div>
      <div class="stat compact"><span>取得</span><strong id="ownedCount">0</strong></div>
    </header>

    <section class="board-wrap" id="boardWrap" aria-label="横長ゲーム盤面">
      <canvas id="board" width="720" height="1120"></canvas>

      <button id="viewLeft" class="pan-button pan-left" type="button" aria-label="盤面を左へ見る">‹</button>
      <button id="viewRight" class="pan-button pan-right" type="button" aria-label="盤面を右へ見る">›</button>

      <div class="zoom-tools" aria-label="表示範囲">
        <button id="zoomOut" type="button" aria-label="広く見る">−</button>
        <button id="zoomReset" type="button" aria-label="標準表示に戻す">100%</button>
        <button id="zoomIn" type="button" aria-label="近く見る">＋</button>
        <button id="distributionBtn" type="button" aria-label="埋蔵分布を見る">分布</button>
        <button id="refreshBtn" type="button" aria-label="ページを更新" onclick="window.location.reload()">更新</button>
      </div>

      <div class="distribution-panel" id="distributionPanel" hidden>
        <div class="distribution-head">
          <strong>公開されている埋蔵分布</strong>
          <button id="distributionClose" type="button" aria-label="閉じる">×</button>
        </div>
        <div id="distributionContent"></div>
      </div>

      <div class="hint" id="hint">大きいスプラッシュ 残り3回・1回15インク</div>
    </section>

    <nav class="actions" aria-label="行動選択">
      <button id="splashBtn" class="action active" type="button">
        <span class="action-icon">✦</span>
        <span>スプラッシュ <small id="splashLeft" class="action-cost">3回</small></span>
      </button>
      <button id="brushBtn" class="action" type="button">
        <span class="action-icon">╱</span>
        <span>筆 <small class="action-cost">長さで消費</small></span>
      </button>
      <button id="newBtn" class="subaction" type="button">新しい盤面</button>
    </nav>

    <div class="result" id="result" hidden>
      <div class="result-card">
        <p>今回の得点</p>
        <strong id="finalScore">0</strong>
        <p class="result-sub">取得 <strong id="finalOwned">0</strong>個</p>
        <div class="result-actions">
          <button id="retryBtn" type="button">同じ盤面でもう一度</button>
          <button id="nextBtn" type="button">新しい盤面</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
