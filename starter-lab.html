<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>START Wrap Lab</title>
  <link rel="stylesheet" href="starter-wrap-lab.css">
</head>
<body>
  <main class="lab">
    <header class="lab-head">
      <div>
        <h1>START Wrap Lab</h1>
        <p class="lead">過去の平面型輪郭を円へ巻いて比較します。良い枠は固定し、ダメな枠だけ別の過去形状へ交換できます。</p>
      </div>
      <div class="toolbar">
        <label class="toggle"><input id="showCore" type="checkbox"> 内部円を表示</label>
        <button id="replaceUnlockedBtn" type="button">固定以外を交換</button>
        <button id="resetBtn" type="button">最初から</button>
      </div>
    </header>

    <section class="status-bar">
      <span id="statusText"></span>
      <button id="copyBtn" type="button">3枠JSONをコピー</button>
    </section>

    <section id="candidates" class="candidates" aria-label="形状候補"></section>

    <section class="history">
      <h2>交換履歴</h2>
      <div id="historyList"></div>
    </section>
  </main>
  <script src="starter-wrap-profiles.js"></script>
  <script src="starter-wrap-lab.js"></script>
</body>
</html>
